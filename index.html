<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bachata Library</title>
<meta name="description" content="Organize, browse, and watch your dance lesson recap videos, stored in your own Google Drive.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0e1218">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bachata">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=2.3.1">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=2.3.1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=2.3.1">
</head>
<body>

  <symbol id="i-fwd5" viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></symbol>

  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></symbol>

</svg>

<div class="app">

  <!-- SIGN IN -->
  <section class="screen" id="s-auth">
    <div class="auth">
      <img class="logo" src="./icons/icon-192.png" alt="">
      <h1>Bachata Library</h1>
      <p class="sub" data-t="tagline"></p>
      <button class="primary" id="btn-signin" data-t="signin"></button>
      <p class="hint" id="auth-hint" data-t="signinHint"></p>
      <div class="setup" id="setup" hidden>
        <h3 data-t="setupTitle"></h3>
        <p data-t="setupBody"></p>
        <ol>
          <li data-t="setupStep1"></li>
          <li data-t="setupStep2"></li>
          <li><span data-t="setupStep3"></span><br><span data-t="origin"></span>: <code id="setup-origin"></code><br><span data-t="redirect"></span>: <code id="setup-redirect"></code></li>
        </ol>
        <div class="input"><input id="setup-client" autocapitalize="off" autocorrect="off" spellcheck="false" data-ph="pasteClient"></div>
        <button class="primary" id="btn-save-client" data-t="saveSignin"></button>
      </div>
    </div>
  </section>

  <!-- LIBRARY -->
  <section class="screen" id="s-library">
    <div class="top">
      <div class="brand">
        <div><h1 data-t="library"></h1><div class="sub" id="lib-sub"></div></div>
        <button class="ib round" id="btn-settings" data-aria="settings"><svg class="i"><use href="#i-gear"/></svg></button>
      </div>
      <div class="pill" id="style-pill" hidden></div>
    </div>
    <div class="searchwrap"><div class="search"><svg class="i"><use href="#i-search"/></svg><input id="search" type="search" autocomplete="off" aria-label="search"></div></div>
    <div class="chips" id="chips"></div>
    <div class="scroll" id="list"></div>
  </section>

  <!-- LESSON -->
  <section class="screen" id="s-detail">
    <button class="back ib" id="btn-back" data-aria="back"><svg class="i"><use href="#i-chev"/></svg></button>
    <div class="topctl" id="topctl">
      <button class="tb2" id="btn-loop" data-aria="repeat"><svg class="i"><use href="#i-repeat"/></svg><span class="bd" id="loop-bd">A</span></button>
      <button class="tb2" id="btn-mirror" data-aria="mirror"><svg class="i"><use href="#i-mirror"/></svg></button>
      <div class="speedwrap"><button class="tb2 speed" id="btn-speed" data-aria="speed">1×</button><div class="menu" id="speed-menu" hidden></div></div>
      <button class="tb2" id="btn-pip" data-aria="pip"><svg class="i"><use href="#i-pip"/></svg></button>
      <button class="tb2" id="btn-fs" data-aria="fullscreen"><svg class="i"><use href="#i-fs"/></svg></button>
    </div>
    <div class="player" id="player">
      <video id="video" playsinline preload="metadata"></video>
      <div class="center" id="center">
        <button class="skip" id="btn-back5" data-aria="back5"><svg class="i"><use href="#i-back5"/></svg><b>5</b></button>
        <button class="bigplay" id="bigplay" data-aria="play"><svg class="i" id="playicon"><use href="#i-play"/></svg></button>
        <button class="skip" id="btn-fwd5" data-aria="fwd5"><svg class="i"><use href="#i-fwd5"/></svg><b>5</b></button>
      </div>
      <div class="vload" id="vload" hidden></div>
      <div class="pctl">
        <span class="time" id="time">0:00 / 0:00</span>
        <div class="scrub" id="scrub"><div class="track"></div><div class="ab" id="ab" hidden></div><div class="fill" id="fill"></div><div class="mk" id="mkA" data-l="A" hidden></div><div class="mk" id="mkB" data-l="B" hidden></div><div class="knob" id="knob"></div></div>
      </div>
    </div>
    <div class="scroll plain" id="detail-scroll">
      <div class="actrow">
        <button class="ib" id="btn-edit" data-aria="edit"><svg class="i"><use href="#i-edit"/></svg></button>
        <a class="ib" id="btn-drive" href="#" target="_blank" rel="noopener" data-aria="drive"><svg class="i"><use href="#i-open"/></svg></a>
        <button class="ib" id="detail-delete" data-aria="delete"><svg class="i"><use href="#i-trash"/></svg></button>
      </div>
      <div id="detail-body"></div>
    </div>
  </section>

  <!-- ADD / EDIT -->
  <section class="screen" id="s-add">
    <div class="top row">
      <div><h1 id="add-title"></h1><div class="sub" id="add-sub"></div></div>
      <button class="ib round" id="btn-cancel" data-aria="close"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="scroll plain">
      <div class="form">
        <label class="pick" id="pick" for="f-file">
          <input type="file" id="f-file" class="vh" accept="video/*">
          <div class="txt"><b data-t="chooseVideo"></b><span data-t="fromWhere"></span></div>
        </label>

        <div class="field"><label data-t="style"></label>
          <div class="seg wrap" id="f-style"></div>
          <div class="input" id="f-style-new-wrap" hidden><input id="f-style-new" data-ph="styleName" autocomplete="off"></div></div>

        <div class="field"><label data-t="lessonType"></label>
          <div class="seg" id="f-type">
            <button type="button" class="on" data-type="group" data-t="groupLesson"></button>
            <button type="button" data-type="private" data-t="privateLesson"></button>
          </div></div>

        <div class="field"><label id="f-source-label" for="f-source"></label>
          <div class="input"><select id="f-source"></select></div>
          <div class="input" id="f-new-wrap" hidden><input id="f-new" data-ph="name" autocomplete="off"></div>
          <div class="hint" id="f-source-hint"></div></div>

        <div class="field"><label for="f-date" data-t="date"></label>
          <div class="input"><input type="date" id="f-date"></div></div>

        <div class="field"><label for="f-title" data-t="title"></label>
          <div class="input"><input id="f-title" data-ph="titlePh" autocomplete="off"></div></div>

        <div class="field"><label for="f-note" data-t="notesOptional"></label>
          <div class="input"><textarea id="f-note" data-ph="notesPh"></textarea></div></div>

        <button class="primary" id="btn-save"></button>
        <div class="progress" id="prog"><i></i></div>
        <div class="hint" id="prog-hint"></div>
        <div class="dangerrow" id="delete-row" hidden>
          <button class="ib danger" id="btn-delete" data-aria="delete"><svg class="i"><use href="#i-trash"/></svg></button>
          <span class="hint" id="delete-hint"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- SCHOOLS -->
  <section class="screen" id="s-schools">
    <div class="top"><h1 data-t="schools"></h1><div class="sub" data-t="schoolsSub"></div></div>
    <div class="scroll" id="schools"></div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="s-settings">
    <div class="top row">
      <div><h1 data-t="settings"></h1><div class="sub" id="set-sub"></div></div>
      <button class="ib round" id="btn-settings-back" data-aria="close"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="scroll plain" id="settings-body"></div>
  </section>

  <div class="toast" id="toast" role="status"></div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-go="library"><svg class="i"><use href="#i-lib"/></svg><span data-t="library"></span></button>
    <button class="fab" id="btn-add" data-aria="add"><svg class="i"><use href="#i-plus"/></svg></button>
    <button class="tab" data-go="schools"><svg class="i"><use href="#i-school"/></svg><span data-t="schools"></span></button>
  </nav>
</div>
<script src="./config.js?v=2.3.1"></script>
<script src="./app.js?v=2.3.1"></script>
</body>
</html>
