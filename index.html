<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DanceLab</title>
<meta name="description" content="Organize, browse, and watch your dance lesson recap videos, stored in your own Google Drive.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<script>try{var t=localStorage.getItem('bl_theme');if(t==='light'||(t==='auto'&&matchMedia('(prefers-color-scheme: light)').matches)){document.documentElement.dataset.theme='light';document.querySelector('meta[name=theme-color]').content='#f2f2f7';document.querySelector('meta[name=color-scheme]').content='light'}}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DanceLab">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=2.9.1">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=2.9.1">
<link rel="stylesheet" href="./styles.css?v=2.9.1">
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 21.5 2 23l1.5-5.5L17 3z"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></symbol>
  <symbol id="i-mirror" viewBox="0 0 24 24"><path d="M12 3v18M8 7l-5 5 5 5M16 7l5 5-5 5"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
  <symbol id="i-fs" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="i-pip" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="8" height="6" rx="1"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 4.6v14.8a1 1 0 0 0 1.52.85l11.9-7.4a1 1 0 0 0 0-1.7l-11.9-7.4A1 1 0 0 0 7.5 4.6z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4.5" height="16" rx="1.2" fill="currentColor" stroke="none"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-back5" viewBox="0 0 24 24"><path d="M8.25 6.5A7.5 7.5 0 1 1 4.95 10.43"/><path d="M8.25 2.6v3.9h3.85"/></symbol>
  <symbol id="i-fwd5" viewBox="0 0 24 24"><path d="M15.75 6.5A7.5 7.5 0 1 0 19.05 10.43"/><path d="M15.75 2.6v3.9H11.9"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></symbol>
  <symbol id="i-lib" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M7 3v18M17 3v18M2 12h20M2 7.5h5M2 16.5h5M17 7.5h5M17 16.5h5"/></symbol>
  <symbol id="i-school" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-ai" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M16 16l-4-4-4 4M12 12v9M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></symbol>
</svg>

<div class="app">

  <!-- SIGN IN -->
  <section class="screen" id="s-auth">
    <div class="auth">
      <img class="logo" src="./icons/icon-192.png?v=2.9.1" alt="">
      <h1>DanceLab</h1>
      <p class="sub" data-t="tagline"></p>
      <button class="primary" id="btn-signin" data-t="signin"></button>
      <p class="hint" id="auth-hint" data-t="signinHint"></p>
      <div class="setup" id="setup" hidden>
        <h3 data-t="setupTitle"></h3>
        <p data-t="setupBody"></p>
        <ol>
          <li data-t="setupStep1"></li>
          <li data-t="setupStep2"></li>
          <li><span data-t="setupStep3"></span><br><span data-t="origin"></span>: <code id="setup-origin"></code><br><span data-t="redirect"></span>: <code id="setup-redirect"></code></li>
        </ol>
        <div class="input"><input id="setup-client" autocapitalize="off" autocorrect="off" spellcheck="false" data-ph="pasteClient"></div>
        <button class="primary" id="btn-save-client" data-t="saveSignin"></button>
      </div>
    </div>
  </section>

  <!-- LIBRARY -->
  <section class="screen" id="s-library">
    <div class="top">
      <div class="brand">
        <div><h1 data-t="library"></h1><div class="sub" id="lib-sub"></div></div>
        <button class="ib round" id="btn-settings" data-aria="settings"><svg class="i"><use href="#i-gear"/></svg></button>
      </div>
    </div>
    <div class="searchwrap"><div class="search"><svg class="i"><use href="#i-search"/></svg><input id="search" type="search" autocomplete="off" aria-label="search"></div></div>
    <div class="filters"><button class="pillbtn" id="flt-style"></button><button class="pillbtn" id="flt-source"></button></div>
    <div class="scroll" id="list"></div>
  </section>

  <!-- LESSON -->
  <section class="screen" id="s-detail">
    <button class="back ib" id="btn-back" data-aria="back"><svg class="i"><use href="#i-chev"/></svg></button>
    <div class="topctl" id="topctl">
      <button class="tb2" id="btn-loop" data-aria="repeat"><svg class="i"><use href="#i-repeat"/></svg><span class="bd" id="loop-bd">A</span></button>
      <button class="tb2" id="btn-mirror" data-aria="mirror"><svg class="i"><use href="#i-mirror"/></svg></button>
      <div class="speedwrap"><button class="tb2 speed" id="btn-speed" data-aria="speed">1×</button><div class="menu" id="speed-menu" hidden></div></div>
      <button class="tb2" id="btn-pip" data-aria="pip"><svg class="i"><use href="#i-pip"/></svg></button>
      <button class="tb2" id="btn-fs" data-aria="fullscreen"><svg class="i"><use href="#i-fs"/></svg></button>
    </div>
    <div class="player" id="player">
      <video id="video" playsinline preload="auto"></video>
      <div class="center" id="center">
        <button class="skip" id="btn-back5" data-aria="back5"><svg class="i"><use href="#i-back5"/></svg><b>5</b></button>
        <button class="bigplay" id="bigplay" data-aria="play"><svg class="i" id="playicon"><use href="#i-play"/></svg></button>
        <button class="skip" id="btn-fwd5" data-aria="fwd5"><svg class="i"><use href="#i-fwd5"/></svg><b>5</b></button>
      </div>
      <div class="vload" id="vload" hidden></div>
      <div class="pctl">
        <span class="time" id="time">0:00 / 0:00</span>
        <div class="scrub" id="scrub"><div class="track"></div><div class="ab" id="ab" hidden></div><div class="fill" id="fill"></div><div class="mk" id="mkA" data-l="A" hidden></div><div class="mk" id="mkB" data-l="B" hidden></div><div class="knob" id="knob"></div></div>
      </div>
    </div>
    <div class="scroll plain" id="detail-scroll">
      <div class="actrow">
        <button class="ib" id="btn-edit" data-aria="edit"><svg class="i"><use href="#i-edit"/></svg></button>
        <a class="ib" id="btn-drive" href="#" target="_blank" rel="noopener" data-aria="drive"><svg class="i"><use href="#i-open"/></svg></a>
        <button class="ib" id="detail-delete" data-aria="delete"><svg class="i"><use href="#i-trash"/></svg></button>
      </div>
      <div id="detail-body"></div>
    </div>
  </section>

  <!-- ADD / EDIT -->
  <section class="screen" id="s-add">
    <div class="top row">
      <div><h1 id="add-title"></h1><div class="sub" id="add-sub"></div></div>
      <button class="ib round" id="btn-cancel" data-aria="close"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="scroll plain">
      <div class="form">
        <label class="pick" id="pick" for="f-file">
          <input type="file" id="f-file" class="vh" accept="video/*">
          <div class="txt"><b data-t="chooseVideo"></b><span data-t="fromWhere"></span></div>
        </label>
        <div class="airow" id="ai-row" hidden>
          <button class="ib aibtn" id="btn-ai" data-aria="ai"><svg class="i"><use href="#i-ai"/></svg></button>
          <span class="hint" id="ai-hint" data-t="aiIdle"></span>
        </div>

        <div class="field"><label data-t="style"></label>
          <div class="seg wrap" id="f-style"></div>
          <div class="input" id="f-style-new-wrap" hidden><input id="f-style-new" data-ph="styleName" autocomplete="off"></div></div>

        <div class="field"><label data-t="lessonType"></label>
          <div class="seg" id="f-type">
            <button type="button" class="on" data-type="group" data-t="groupLesson"></button>
            <button type="button" data-type="private" data-t="privateLesson"></button>
          </div></div>

        <div class="field"><label id="f-source-label" for="f-source"></label>
          <div class="input"><select id="f-source"></select></div>
          <div class="input" id="f-new-wrap" hidden><input id="f-new" data-ph="name" autocomplete="off"></div>
          <div class="hint" id="f-source-hint"></div></div>

        <div class="field"><label for="f-date" data-t="date"></label>
          <div class="input"><input type="date" id="f-date"></div></div>

        <div class="field"><label for="f-title" data-t="title"></label>
          <div class="input"><input id="f-title" autocomplete="off"></div></div>

        <div class="field"><label for="f-desc" data-t="desc"></label>
          <div class="input"><textarea id="f-desc"></textarea></div></div>

        <div class="field"><label data-t="tagsLabel"></label>
          <div class="tagpick" id="f-tags"></div></div>

        <div class="field" id="f-chapters-wrap" hidden><label data-t="figures"></label>
          <div id="f-chapters"></div></div>

        <div class="field"><label for="f-note" data-t="notesOptional"></label>
          <div class="input"><textarea id="f-note"></textarea></div></div>

        <button class="primary" id="btn-save"></button>
        <div class="progress" id="prog"><i></i></div>
        <div class="hint" id="prog-hint"></div>
        <div class="dangerrow" id="delete-row" hidden>
          <button class="ib danger" id="btn-delete" data-aria="delete"><svg class="i"><use href="#i-trash"/></svg></button>
          <span class="hint" id="delete-hint"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- SCHOOLS -->
  <section class="screen" id="s-schools">
    <div class="top"><h1 data-t="schools"></h1><div class="sub" data-t="schoolsSub"></div></div>
    <div class="scroll" id="schools"></div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="s-settings">
    <div class="top row">
      <div><h1 data-t="settings"></h1><div class="sub" id="set-sub"></div></div>
      <button class="ib round" id="btn-settings-back" data-aria="close"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="scroll plain" id="settings-body"></div>
  </section>

  <div class="sheetwrap" id="sheet" hidden><div class="dim" id="sheet-dim"></div><div class="sheet" role="dialog"><div class="grab"></div><h4><span id="sheet-title"></span><button id="sheet-reset" data-t="reset"></button></h4><div id="sheet-body"></div></div></div>

  <div class="toast" id="toast" role="status"></div>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-go="library"><svg class="i"><use href="#i-lib"/></svg><span data-t="library"></span></button>
    <button class="fab" id="btn-add" data-aria="add"><svg class="i"><use href="#i-plus"/></svg></button>
    <button class="tab" data-go="schools"><svg class="i"><use href="#i-school"/></svg><span data-t="schools"></span></button>
  </nav>
</div>
<script src="./config.js?v=2.9.1"></script>
<script src="./gemini.js?v=2.9.1"></script>
<script src="./app.js?v=2.9.1"></script>
</body>
</html>
