 {id:4,date:'2026-08-28',style:'באצ׳טה',source:'VDance',type:'group',dur:115,th:'https://picsum.photos/seed/bachata4/400/520',figs:[['שאדו פוזישן',0],['סומבררו',6]],note:''},
 {id:5,date:'2026-08-21',style:'סלסה',source:'סטודיו ריו',type:'group',dur:190,th:'https://picsum.photos/seed/salsa5/400/520',figs:[['סוזי קיו',0],['שיינס',3]],note:'תרגול שיינס 10 דקות ביום.'},
];
const SOURCES=[{name:'VDance',kind:'school'},{name:'סטודיו ריו',kind:'school'},{name:'אנה רואיז',kind:'private'}];
let style='הכול', src=null, cur=null;
const $=id=>document.getElementById(id);
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const dLong=d=>new Date(d+'T12:00').toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
const dShort=d=>new Date(d+'T12:00').toLocaleDateString('he-IL',{day:'numeric',month:'short'});
const month=d=>new Date(d+'T12:00').toLocaleDateString('he-IL',{month:'long',year:'numeric'});
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id)); if(id!=='s-les') video.pause();}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800)}
function render(){
  $('styles').innerHTML=['הכול','באצ׳טה','סלסה'].map(s=>`<button class="${style===s?'on':''}" data-s="${s}">${s}</button>`).join('');
  $('schools').innerHTML=`<button class="sc ${!src?'on':''}" data-src=""><span class="av">✦</span>הכול</button>`+SOURCES.map(s=>`<button class="sc ${s.kind==='private'?'teacher':''} ${src===s.name?'on':''}" data-src="${s.name}"><span class="av">${s.name.slice(0,1)}</span>${s.name}</button>`).join('');
  let items=L.filter(l=>(style==='הכול'||l.style===style)&&(!src||l.source===src));
  $('count').textContent=`${L.length} סיכומים · ${SOURCES.filter(s=>s.kind==='school').length} בתי ספר · מורה פרטי אחד`;
  let h='',last='';
  items.forEach(l=>{const m=month(l.date); if(m!==last){h+=`<div class="month">${m}</div>`;last=m;}
    h+=`<div class="card" data-id="${l.id}" style="background-image:url(${l.th})"><span class="tag ${l.type==='private'?'priv':''}">${l.type==='private'?'פרטי':'קבוצתי'}</span><span class="dur">${fmt(l.dur)}</span><div class="txt"><div class="ttl">${l.figs.map(f=>f[0]).slice(0,2).join(' · ')}</div><div class="meta">${l.source} · ${dShort(l.date)}</div><span class="st">${l.style}</span></div></div>`;});
  $('grid').innerHTML=h||'<div class="count" style="grid-column:1/-1;padding:40px 0;text-align:center">אין סיכומים בסינון הזה.</div>';
}
$('styles').onclick=e=>{const b=e.target.closest('button');if(b){style=b.dataset.s;render();}};
$('schools').onclick=e=>{const b=e.target.closest('.sc');if(b){src=b.dataset.src||null;render();}};
$('grid').onclick=e=>{const r=e.target.closest('.card');if(r)open(+r.dataset.id)};
$('back').onclick=()=>show('s-lib'); $('fab').onclick=()=>show('s-add'); $('close').onclick=()=>show('s-lib');
function open(id){cur=L.find(l=>l.id===id); show('s-les'); abReset();
  $('lTitle').textContent=cur.figs.map(f=>f[0]).join(' · ');
  $('lMeta').innerHTML=`<span>${cur.source}</span><span>·</span><span>${cur.type==='private'?'שיעור פרטי':'שיעור קבוצתי'}</span><span>·</span><span>${dLong(cur.date)}</span><span style="color:var(--accent);font-weight:600">${cur.style}</span><button class="edit ib" aria-label="עריכה"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>`;
  $('figs').innerHTML=cur.figs.map(f=>`<button class="figc" data-t="${f[1]}"><span class="tm">${fmt(f[1])}</span><span>${f[0]}</span></button>`).join('')+`<button class="figc add" aria-label="סימון פיגורה"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>`;
  $('lNote').textContent=cur.note||'אין הערות עדיין. אפשר להוסיף דרך „עריכה”.'; $('lNote').style.color=cur.note?'':'var(--muted)';
  video.currentTime=0;}
$('figs').onclick=e=>{const f=e.target.closest('.figc[data-t]');if(f){video.currentTime=+f.dataset.t;video.play();}};
const video=$('video'), fill=$('fill'), knob=$('knob');
$('bigplay').onclick=()=>video.play();
video.onclick=()=>video.paused?video.play():video.pause();
video.onplay=()=>$('bigplay').classList.add('hide'); video.onpause=()=>$('bigplay').classList.remove('hide');
video.ontimeupdate=()=>{const p=video.duration?video.currentTime/video.duration:0;fill.style.width=knob.style.left=(p*100)+'%';$('time').textContent=`${fmt(video.currentTime)} / ${fmt(video.duration||0)}`; if(B!==null&&video.currentTime>=B) video.currentTime=A;};
video.onloadedmetadata=()=>{$('time').textContent=`0:00 / ${fmt(video.duration)}`};
const scrub=$('scrub'); const seekAt=x=>{const r=scrub.getBoundingClientRect();video.currentTime=Math.max(0,Math.min(1,(x-r.left)/r.width))*video.duration;};
scrub.onpointerdown=e=>{seekAt(e.clientX);scrub.setPointerCapture(e.pointerId);scrub.onpointermove=ev=>seekAt(ev.clientX);}; scrub.onpointerup=()=>scrub.onpointermove=null;
$('speed').onclick=e=>{const b=e.target.closest('button');if(!b)return;video.playbackRate=+b.dataset.r;$('speed').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));};
$('mirror').onclick=()=>{video.classList.toggle('mirror');$('mirror').classList.toggle('on');};
$('fs').onclick=()=>{ if(video.webkitEnterFullscreen&&/iPhone/.test(navigator.userAgent)) video.webkitEnterFullscreen(); else if($('player').requestFullscreen) $('player').requestFullscreen(); else if(video.webkitEnterFullscreen) video.webkitEnterFullscreen(); };
$('pip').onclick=async()=>{ try{ if(video.requestPictureInPicture) await video.requestPictureInPicture(); else if(video.webkitSetPresentationMode) video.webkitSetPresentationMode('picture-in-picture'); else toast('הדפדפן הזה לא תומך בתמונה בתוך תמונה'); }catch(e){toast('צריך להתחיל לנגן קודם')} };
if(!(document.pictureInPictureEnabled||video.webkitSupportsPresentationMode)) $('pip').style.display='none';
let A=null,B=null;
function abReset(){A=B=null;$('abBtn').classList.remove('on');$('abBd').hidden=false;$('abBd').textContent='A';$('abH').textContent='חזרה על קטע: לחיצה ראשונה מסמנת התחלה (A), שנייה מסמנת סוף (B), והקטע ינוגן שוב ושוב.';['mkA','mkB','ab'].forEach(i=>$(i).hidden=true);}
$('abBtn').onclick=()=>{ if(A===null){A=video.currentTime;$('abBd').textContent='B';$('abH').textContent=`התחלה סומנה ב‑${fmt(A)}. נגנו עד סוף הקטע ולחצו שוב.`;$('mkA').hidden=false;$('mkA').style.left=(A/video.duration*100)+'%'; if(video.paused) video.play(); }
  else if(B===null){B=Math.max(video.currentTime,A+0.5);$('abBtn').classList.add('on');$('abBd').hidden=true;$('abH').textContent=`חוזר על ${fmt(A)}–${fmt(B)}. לחיצה נוספת מבטלת.`;$('mkB').hidden=false;$('mkB').style.left=(B/video.duration*100)+'%';$('ab').hidden=false;$('ab').style.left=(A/video.duration*100)+'%';$('ab').style.width=((B-A)/video.duration*100)+'%';video.currentTime=A;video.play();}
  else abReset(); };
render();
</script>
